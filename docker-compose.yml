version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: travel_ml
      POSTGRES_USER: travel_user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/scripts:/docker-entrypoint-initdb.d

  backend:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql+psycopg2://travel_user:password@db:5432/travel_ml
      PYTHONPATH: /app  # добавляем корень в PYTHONPATH
    volumes:
      - .:/app  # монтируем весь проект
    command: >
      sh -c "
        echo 'Waiting for database...' &&
        sleep 5 &&
        echo 'Initializing database...' &&
        cd /app/database/scripts &&
        python init_db.py &&
        python seed_data.py &&
        echo 'Starting server...' &&
        cd /app &&
        uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload
      "

  frontend:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
    depends_on:
      - backend

volumes:
  postgres_data: