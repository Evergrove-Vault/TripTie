<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TripTie - Регистрация</title>
    <link rel="stylesheet" href="style_reg.css">
</head>
<body>
    <div class="container">
        <div class="form-box">
            <h1>TripTie</h1>
            <p class="subtitle" id="subtitle">Привет, странник!</p>

            <form id="registerForm">
                <!-- Поле для имени пользователя -->
                <input type="text" 
                       id="username" 
                       name="username" 
                       placeholder="Имя пользователя" 
                       required>
                
                <!-- Поле для email (добавили) -->
                <input type="email" 
                       id="email" 
                       name="email" 
                       placeholder="Email" 
                       required>
                
                <!-- Поле для пароля -->
                <input type="password" 
                       id="password" 
                       name="password" 
                       placeholder="Пароль" 
                       required>
                
                <!-- Кнопка регистрации -->
                <button type="submit" class="btn" id="submitBtn">
                    Зарегистрироваться
                </button>
                
                <!-- Сообщение об ошибке/успехе -->
                <div id="message" style="
                    margin-top: 15px;
                    padding: 10px;
                    border-radius: 6px;
                    display: none;
                    font-size: 14px;
                "></div>
            </form>

            <div class="toggle">
                <p>Уже есть аккаунт? <a href="#" id="loginLink">Войти</a></p>
            </div>
        </div>
    </div>
    
    <footer class="footer">
        <a href="#">Обратная связь</a>
    </footer>

    <script>
        // Простой JavaScript для отправки формы
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById('registerForm');
            const messageDiv = document.getElementById('message');
            const submitBtn = document.getElementById('submitBtn');
            const loginLink = document.getElementById('loginLink');
            
            // Базовый URL бекенда
            const API_BASE_URL = 'http://localhost:8000';
            
            // Обработка отправки формы
            form.addEventListener('submit', async function(event) {
                event.preventDefault();
                
                // Получаем данные формы
                const formData = {
                    username: document.getElementById('username').value,
                    email: document.getElementById('email').value,
                    password: document.getElementById('password').value
                };
                
                // Показываем загрузку
                submitBtn.textContent = 'Регистрация...';
                submitBtn.disabled = true;
                
                try {
                    // Отправляем запрос на бекенд
                    const response = await fetch(`${API_BASE_URL}/auth/register`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify(formData)
                    });
                    
                    const data = await response.json();
                    
                    // Обрабатываем ответ
                    if (response.ok) {
                        showMessage(`Успех! Пользователь ${data.username} создан.`, 'success');
                        form.reset(); // Очищаем форму
                    } else {
                        showMessage(`Ошибка: ${data.detail || 'Неизвестная ошибка'}`, 'error');
                    }
                } catch (error) {
                    showMessage(`Ошибка соединения: ${error.message}`, 'error');
                } finally {
                    // Восстанавливаем кнопку
                    submitBtn.textContent = 'Зарегистрироваться';
                    submitBtn.disabled = false;
                }
            });
            
            // Функция показа сообщений
            function showMessage(text, type) {
                messageDiv.textContent = text;
                messageDiv.style.display = 'block';
                
                if (type === 'success') {
                    messageDiv.style.backgroundColor = '#d4edda';
                    messageDiv.style.color = '#155724';
                    messageDiv.style.border = '1px solid #c3e6cb';
                } else {
                    messageDiv.style.backgroundColor = '#f8d7da';
                    messageDiv.style.color = '#721c24';
                    messageDiv.style.border = '1px solid #f5c6cb';
                }
                
                // Скрываем сообщение через 5 секунд
                setTimeout(() => {
                    messageDiv.style.display = 'none';
                }, 5000);
            }
            
            // Обработка ссылки "Войти"
            loginLink.addEventListener('click', function(event) {
                event.preventDefault();
                showMessage('Функция входа появится позже', 'error');
            });
        });
    </script>
</body>
</html>
